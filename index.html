<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.O.E. // DUAL-ARCHITECTURE CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');
        
        /* SYS-D022 STANDARDS */
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e0e0e0; height: 100vh; overflow: hidden; }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        .bg-void { background-color: #050505; }
        .bg-surface { background-color: #111111; }
        .border-line { border-color: #222222; }
        .text-accent-blue { color: #3b82f6; }
        .text-accent-green { color: #4CAF50; }
        .mono { font-family: 'Courier New', monospace; letter-spacing: 0.1em; }
        
        button { transition: all 0.2s; border: 1px solid #222; text-transform: uppercase; }
        button:hover:not(:disabled) { border-color: #fff; color: #fff; }
        button:active:not(:disabled) { transform: scale(0.98); }
        
        input, select, textarea { 
            background: #050505; border: 1px solid #222; padding: 0.5rem; 
            width: 100%; outline: none; color: #fff; font-family: 'Inter', sans-serif; font-size: 12px;
        }
        input:focus, select:focus, textarea:focus { border-color: #4CAF50; }

        .prospect-card { cursor: pointer; border-left: 2px solid transparent; }
        .prospect-card:hover { background-color: #1a1a1a; }
        .prospect-card.active { border-left-color: #4CAF50; background-color: #111; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- GLOBAL HEADER & MATRIX TRACKER -->
    <header class="border-b border-line p-4 md:px-8 bg-surface flex justify-between items-center shrink-0">
        <div>
            <h1 class="text-2xl font-bold uppercase tracking-tighter text-white">M.O.E. CRM Terminal</h1>
            <p class="text-[10px] mono text-[#888] mt-1">Dual-Architecture Ledger & Ascension Logic</p>
        </div>
        
        <!-- 100:10:5:1 MATRIX TRACKER -->
        <div class="flex gap-6 border-l border-line pl-6">
            <div class="text-center">
                <p class="text-[9px] mono text-[#888] uppercase">Prospects (100)</p>
                <p id="mat-prospects" class="text-lg font-bold text-white mono">0</p>
            </div>
            <div class="text-center">
                <p class="text-[9px] mono text-[#888] uppercase">Guests (10)</p>
                <p id="mat-guests" class="text-lg font-bold text-accent-blue mono">0</p>
            </div>
            <div class="text-center">
                <p class="text-[9px] mono text-[#888] uppercase">Customers (5)</p>
                <p id="mat-customers" class="text-lg font-bold text-white mono">0</p>
            </div>
            <div class="text-center">
                <p class="text-[9px] mono text-accent-green uppercase">Builders (1)</p>
                <p id="mat-builders" class="text-lg font-bold text-accent-green mono">0</p>
            </div>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        
        <!-- LEFT PANEL: THE LEDGER (CRM) -->
        <aside class="w-1/3 border-r border-line bg-void flex flex-col h-full">
            <div class="p-4 border-b border-line bg-surface space-y-2">
                <h2 class="text-[10px] font-bold uppercase text-[#888] tracking-widest">Intake Engine</h2>
                <input type="text" id="new-name" placeholder="Prospect Name..." onkeypress="handleEnter(event)">
                <div class="flex gap-2">
                    <input type="text" id="new-source" placeholder="Source (e.g. KLCC, IG)" class="w-1/2">
                    <select id="new-goal" class="w-1/2 text-gray-400">
                        <option value="Unspecified">Health Goal</option>
                        <option value="Energy/Crash">3PM Energy Crash</option>
                        <option value="Weight/Fat">Weight / Body Fat</option>
                        <option value="Gut/Digestion">Gut / Digestion</option>
                        <option value="Joint/Inflammation">Joints / Inflammation</option>
                        <option value="Business/Peluang">Business / Peluang</option>
                    </select>
                </div>
                <button onclick="addProspect()" class="w-full py-2 text-xs font-bold bg-[#111] hover:bg-[#222] text-white">ADD TO LEDGER +</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-2 space-y-1" id="roster-list">
                <!-- Prospect list injected here via JS -->
            </div>

            <div class="p-4 border-t border-line bg-surface">
                <button onclick="syncToSheets()" class="w-full py-3 text-[10px] font-bold bg-[#111] text-accent-green border-line hover:border-accent-green">
                    Copy TSV For Google Sheets
                </button>
                <button onclick="factoryReset()" class="w-full mt-2 py-2 text-[9px] text-[#555] border-transparent hover:text-red-500">
                    Wipe Local Database
                </button>
            </div>
        </aside>

        <!-- RIGHT PANEL: THE LOGIC SIMULATOR -->
        <section class="w-2/3 bg-surface flex flex-col relative overflow-y-auto" id="gate-panel">
            <div class="h-full flex items-center justify-center text-[#555] text-sm font-mono tracking-widest uppercase">
                Select an initiate from the ledger to deploy logic gates.
            </div>
        </section>

    </main>

    <script>
        // STATE MANAGEMENT
        let state = JSON.parse(localStorage.getItem('moe_crm_v3')) || { 
            prospects: [], // { id, name, source, goal, sts: boolean, stage: string, dateAdded: string, notes: string }
            selectedId: null
        };

        // THE ASCENSION LOGIC TREE
        const logicTree = {
            'start': {
                title: "Gate 1: The Intercept",
                desc: "Initiate contact. Are you carrying the Tanita scanner (Stationed) or only VIP Passports (Mobile)?",
                script: "Internal Check: What is your current physical context?",
                actions: [
                    { label: "Mobile (VIP Cards Only)", next: '1a', color: 'text-white' },
                    { label: "Stationed (Scanner on Hand)", next: '1b', color: 'text-accent-blue' },
                    { label: "Hard Reject (Dead Lead)", next: 'rejected', color: 'text-[#ff4444]' }
                ]
            },
            '1a': {
                title: "Gate 1A: Lead Capture & Book",
                desc: "No scanner available. Secure WhatsApp number and book the triage slot. Use the 3PM crash angle.",
                script: "\"I’m handing out VIP Passports today to fix that 3 PM crash. I have a slot tomorrow. What's your WhatsApp number for the pin?\"",
                actions: [
                    { label: "Number Secured. Booked.", next: 'triage', color: 'text-accent-green' },
                    { label: "Flaked / Fake Number", next: 'rejected', color: 'text-[#ff4444]' }
                ]
            },
            '1b': {
                title: "Gate 1B: Immediate Triage",
                desc: "Scanner equipped. Trade 'Liquid Trust' (shake) for an immediate 60-second body composition scan.",
                script: "\"Try this. While you're drinking that, step on this scale. What's your biggest physical friction?\"",
                actions: [
                    { label: "Scan Completed. Data Extracted.", next: 'triage', color: 'text-accent-green' }
                ]
            },
            'triage': {
                title: "Gate 2: Iron Skeleton Triage (Guest)",
                desc: "Extract Magic Number, Protein Goal, and Metabolic Age. Execute the Visceral Inversion.",
                script: "\"Looking at your visceral fat, your biological engine is aging 10 years faster than your calendar age.\"",
                actions: [
                    { label: "Proceed to Bayanihan Close", next: 'close', color: 'text-white' }
                ]
            },
            'close': {
                title: "Gate 3: The Value Close",
                desc: "Offer the Neighborhood Pass. Frame consultation as free, physical fuel as the only cost.",
                script: "\"I want to set you up with the Neighborhood Pass. Consultation is free, just cover the physical fuel. QR or Cash?\"",
                actions: [
                    { label: "Payment Secured (Customer)", next: 'ascension', color: 'text-accent-green' },
                    { label: "Needs Follow-up", next: 'followup', color: 'text-[#ff4444]' }
                ]
            },
            'followup': {
                title: "Holding Pattern: Follow-up",
                desc: "Prospect hesitated. Deploy AETS automated check-ins or manual touchpoints.",
                script: "\"No rush. I'm sending you a 1-minute breakdown of what we discussed on WhatsApp to review later.\"",
                actions: [
                    { label: "Resurrected: Payment Secured", next: 'ascension', color: 'text-accent-green' },
                    { label: "Dead Lead", next: 'rejected', color: 'text-[#ff4444]' }
                ]
            },
            'ascension': {
                title: "Gate 4: Active Customer",
                desc: "Transaction complete. Plug them into the Bayanihan Ecosystem (Shake Party/Club).",
                script: "\"Here is your fuel. I'm adding you to the VIP guest list for our upcoming Shake Party to track your data.\"",
                actions: [
                    { label: "Client Plugged into Ecosystem", next: 'complete', color: 'text-accent-blue' }
                ]
            },
            'complete': {
                title: "Protocol Complete (Builder/Active)",
                desc: "This node is fully active. Transition to Retention and Operator Ascension tracking.",
                script: "Monitor for 500 VP / 2,000 VP Operator Trigger.",
                actions: []
            },
            'rejected': {
                title: "Lead Rejected",
                desc: "This node has been terminated from the active pipeline.",
                script: "10:1 Mathematics of Detachment. Move to the next prospect.",
                actions: [
                    { label: "Re-engage Lead", next: 'start', color: 'text-white' }
                ]
            }
        };

        // DOM ELEMENTS
        const rosterList = document.getElementById('roster-list');
        const gatePanel = document.getElementById('gate-panel');

        function handleEnter(e) { if (e.key === 'Enter') addProspect(); }

        function addProspect() {
            const name = document.getElementById('new-name').value.trim();
            const source = document.getElementById('new-source').value.trim() || 'Unknown';
            const goal = document.getElementById('new-goal').value;
            
            if(!name) return;
            
            const newLead = {
                id: Date.now(),
                name: name,
                source: source,
                goal: goal,
                sts: false,
                stage: 'start',
                dateAdded: new Date().toISOString(),
                notes: ""
            };
            
            state.prospects.unshift(newLead);
            state.selectedId = newLead.id; 
            
            // Clear inputs
            document.getElementById('new-name').value = '';
            document.getElementById('new-source').value = '';
            document.getElementById('new-goal').value = 'Unspecified';
            
            saveAndRender();
        }

        function selectProspect(id) {
            // Save current notes before switching if a prospect is selected
            if(state.selectedId) {
                const noteBox = document.getElementById('cadence-journal');
                if(noteBox) {
                    const currentProspect = state.prospects.find(p => p.id === state.selectedId);
                    if(currentProspect) currentProspect.notes = noteBox.value;
                }
            }
            state.selectedId = id;
            saveAndRender();
        }

        function advanceLead(nextStage) {
            const prospect = state.prospects.find(p => p.id === state.selectedId);
            if(prospect) {
                prospect.stage = nextStage;
                saveAndRender();
            }
        }
        
        function toggleSTS() {
            const prospect = state.prospects.find(p => p.id === state.selectedId);
            if(prospect) {
                prospect.sts = !prospect.sts;
                saveAndRender();
            }
        }
        
        function saveNotes() {
            const prospect = state.prospects.find(p => p.id === state.selectedId);
            const noteBox = document.getElementById('cadence-journal');
            if(prospect && noteBox) {
                prospect.notes = noteBox.value;
                saveAndRender();
            }
        }

        function deleteProspect(id) {
            if(confirm("Delete this prospect permanently?")) {
                state.prospects = state.prospects.filter(p => p.id !== id);
                if(state.selectedId === id) state.selectedId = null;
                saveAndRender();
            }
        }

        // GOOGLE SHEETS EXPORT (TSV Format)
        function syncToSheets() {
            if(state.prospects.length === 0) return alert("Roster is empty.");
            
            // Ensures active notes are saved before sync
            if(state.selectedId) {
                const noteBox = document.getElementById('cadence-journal');
                if(noteBox) state.prospects.find(p => p.id === state.selectedId).notes = noteBox.value;
                localStorage.setItem('moe_crm_v3', JSON.stringify(state));
            }
            
            let tsv = "Date Added\tProspect Name\tSource\tHealth Goal\tSTS Attended\tCurrent Stage\tCadence Notes\n";
            state.prospects.forEach(p => {
                const d = new Date(p.dateAdded).toLocaleDateString();
                const notes = p.notes ? p.notes.replace(/\n/g, ' ') : ""; // Prevent line breaks breaking TSV
                tsv += `${d}\t${p.name}\t${p.source}\t${p.goal}\t${p.sts ? 'YES' : 'NO'}\t${p.stage.toUpperCase()}\t${notes}\n`;
            });

            navigator.clipboard.writeText(tsv).then(() => {
                alert("Data Copied! Paste directly into Google Sheets (Cell A1).");
            });
        }

        function factoryReset() {
            if(confirm("WARNING: This will wipe all prospects and data. Are you sure?")) {
                localStorage.removeItem('moe_crm_v3');
                state = { prospects: [], selectedId: null };
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('moe_crm_v3', JSON.stringify(state));
            renderRoster();
            renderLogicGate();
            updateMatrix();
        }
        
        function updateMatrix() {
            let pCount = state.prospects.length;
            let gCount = state.prospects.filter(p => ['triage', 'close', 'followup', 'ascension', 'complete'].includes(p.stage) || p.sts).length;
            let cCount = state.prospects.filter(p => ['ascension', 'complete'].includes(p.stage)).length;
            let bCount = state.prospects.filter(p => p.stage === 'complete').length;
            
            document.getElementById('mat-prospects').innerText = pCount;
            document.getElementById('mat-guests').innerText = gCount;
            document.getElementById('mat-customers').innerText = cCount;
            document.getElementById('mat-builders').innerText = bCount;
        }

        function renderRoster() {
            rosterList.innerHTML = '';
            state.prospects.forEach(p => {
                let badgeColor = 'bg-[#222] text-[#888]';
                if(p.stage === 'ascension') badgeColor = 'bg-[#3b82f6]/20 text-[#3b82f6]';
                if(p.stage === 'complete') badgeColor = 'bg-[#4CAF50]/20 text-[#4CAF50]';
                if(p.stage === 'rejected') badgeColor = 'bg-[#ff4444]/20 text-[#ff4444]';
                
                const div = document.createElement('div');
                div.className = `prospect-card p-3 flex justify-between items-center ${p.id === state.selectedId ? 'active' : ''}`;
                div.onclick = () => selectProspect(p.id);
                div.innerHTML = `
                    <div>
                        <p class="text-sm font-bold uppercase text-white">${p.name}</p>
                        <p class="text-[9px] mono mt-1 ${badgeColor} inline-block px-1 rounded-sm uppercase">${p.stage}</p>
                        ${p.sts ? `<span class="text-[9px] mono bg-purple-900/40 text-purple-400 px-1 rounded-sm ml-1">STS</span>` : ''}
                    </div>
                    <button onclick="event.stopPropagation(); deleteProspect(${p.id})" class="text-[10px] text-[#555] hover:text-red-500 border-none px-2">X</button>
                `;
                rosterList.appendChild(div);
            });
        }

        function renderLogicGate() {
            if(!state.selectedId) {
                gatePanel.innerHTML = `<div class="h-full flex items-center justify-center text-[#555] text-sm mono uppercase">Select an initiate from the ledger to deploy logic gates.</div>`;
                return;
            }

            const prospect = state.prospects.find(p => p.id === state.selectedId);
            const step = logicTree[prospect.stage];
            
            const stsBtnColor = prospect.sts ? 'bg-purple-900/50 text-purple-300 border-purple-500' : 'bg-[#111] text-[#555] border-line';

            let html = `
                <!-- PROFILE HEADER -->
                <div class="p-8 border-b border-line bg-void flex justify-between items-start">
                    <div>
                        <p class="text-[10px] text-[#888] mono uppercase tracking-widest mb-1">Active Target Profile</p>
                        <h2 class="text-3xl font-bold uppercase text-white tracking-tighter mb-3">${prospect.name}</h2>
                        <div class="flex gap-2 text-[10px] mono uppercase">
                            <span class="bg-[#222] text-[#aaa] px-2 py-1 rounded-sm">Src: ${prospect.source}</span>
                            <span class="bg-[#222] text-[#aaa] px-2 py-1 rounded-sm">Obj: ${prospect.goal}</span>
                        </div>
                    </div>
                    <button onclick="toggleSTS()" class="px-4 py-2 text-[10px] font-bold uppercase tracking-widest ${stsBtnColor}">
                        ${prospect.sts ? '✓ STS Attended' : 'Mark STS Attended'}
                    </button>
                </div>
                
                <div class="flex-1 p-8 overflow-y-auto flex flex-col">
                    
                    <!-- GATE INFO -->
                    <div class="mb-8">
                        <p class="text-[10px] mono text-[#888] uppercase mb-2">Current Pipeline Protocol</p>
                        <h3 class="text-2xl font-bold text-white mb-3 uppercase tracking-tighter serif">${step.title}</h3>
                        <p class="text-sm text-[#aaa] leading-relaxed">${step.desc}</p>
                    </div>
                    
                    ${step.script ? `
                    <div class="border-l-2 border-accent-blue pl-4 mb-8 bg-accent-blue/5 p-4">
                        <p class="text-[9px] mono text-accent-blue uppercase tracking-widest mb-2">Execution Script</p>
                        <p class="text-sm text-white italic">"${step.script}"</p>
                    </div>
                    ` : ''}

                    <!-- ACTIONS -->
                    <div class="space-y-3 mb-10">
            `;
            
            step.actions.forEach(btn => {
                html += `
                    <button onclick="advanceLead('${btn.next}')" class="w-full bg-[#111] border border-line p-4 text-xs font-bold uppercase tracking-widest ${btn.color} hover:bg-[#1a1a1a] text-left">
                        > ${btn.label}
                    </button>
                `;
            });

            html += `
                    </div>
                    
                    <!-- CADENCE JOURNAL -->
                    <div class="mt-auto border-t border-line pt-6">
                        <div class="flex justify-between items-center mb-2">
                            <p class="text-[10px] mono text-[#888] uppercase">Target Cadence & Reflection Journal</p>
                            <button onclick="saveNotes()" class="text-[9px] text-accent-green hover:text-white border-none">Save Note</button>
                        </div>
                        <textarea id="cadence-journal" onblur="saveNotes()" class="w-full h-32 text-xs" placeholder="Log engagement details, objections, or follow-up dates here...">${prospect.notes || ''}</textarea>
                    </div>
                </div>
            `;
            
            gatePanel.innerHTML = html;
        }

        // INIT
        saveAndRender();
    </script>
</body>
</html>
