<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.O.E. // COMMAND CENTER V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Mono:wght@400;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .mono { font-family: 'Space Mono', monospace; letter-spacing: 0.05em; }
        .bg-void { background-color: #050505; }
        .bg-surface { background-color: #111111; }
        .border-line { border-color: #222222; }
        .text-accent-blue { color: #3b82f6; }
        .text-accent-green { color: #3de0b0; }
        .text-accent-gold { color: #f0b429; }
        .text-accent-coral { color: #ff6b55; }
        
        button { transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em; }
        button:active { transform: scale(0.98); }
        
        input, select, textarea { 
            background: #050505; border: 1px solid #222; padding: 0.75rem; 
            width: 100%; outline: none; color: #fff; font-family: 'Inter', sans-serif; font-size: 13px; border-radius: 4px;
        }
        input:focus, select:focus, textarea:focus { border-color: #3de0b0; }
        
        .prospect-card { cursor: pointer; border-left: 3px solid transparent; border-radius: 0 8px 8px 0; margin-bottom: 4px; transition: background 0.2s;}
        .prospect-card:hover { background-color: #1a1a1a; }
        .prospect-card.active { border-left-color: #3de0b0; background-color: #111; }
        .prospect-card.hvo-active { border-left-color: #f0b429; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Custom Modal for No-Alert policy */
        #custom-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; align-items: center; justify-content: center; }
        #custom-modal.active { display: flex; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="border-b border-line p-4 md:px-6 bg-surface flex justify-between items-center shrink-0 shadow-md z-10">
        <div>
            <h1 class="text-xl font-bold uppercase tracking-tighter text-white">M.O.E. COMMAND CENTER</h1>
            <p class="text-[10px] mono text-[#888] mt-1">Autonomous Inventory & Pipeline Tracker // V4</p>
        </div>
        
        <div class="flex gap-6 border-l border-line pl-6">
            <div class="text-center">
                <p class="text-[9px] mono text-[#888] uppercase">Cold / Queue</p>
                <p id="mat-prospects" class="text-lg font-bold text-white mono">0</p>
            </div>
            <div class="text-center">
                <p class="text-[9px] mono text-[#888] uppercase">Triaged</p>
                <p id="mat-guests" class="text-lg font-bold text-accent-blue mono">0</p>
            </div>
            <div class="text-center">
                <p class="text-[9px] mono text-[#888] uppercase">Active (Fuel)</p>
                <p id="mat-customers" class="text-lg font-bold text-accent-green mono">0</p>
            </div>
            <div class="text-center">
                <p class="text-[9px] mono text-accent-gold uppercase">HVO Builders</p>
                <p id="mat-builders" class="text-lg font-bold text-accent-gold mono">0</p>
            </div>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        
        <aside class="w-[350px] border-r border-line bg-void flex flex-col h-full shrink-0">
            <div class="p-4 border-b border-line bg-surface space-y-3">
                <h2 class="text-[10px] font-bold uppercase text-accent-green tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-accent-green animate-pulse"></span> Intake Node
                </h2>
                <input type="text" id="new-name" placeholder="Target Name...">
                <input type="tel" id="new-phone" placeholder="WhatsApp / Phone (e.g. 60123456789)">
                <div class="flex gap-2">
                    <input type="text" id="new-source" placeholder="Source" class="w-1/2">
                    <select id="new-goal" class="w-1/2 text-gray-400">
                        <option value="Unspecified">Objective</option>
                        <option value="Health/Energy">Metabolic/Energy</option>
                        <option value="B2B/Systems">B2B / Studio</option>
                        <option value="Business/Wealth">Income/Wealth</option>
                    </select>
                </div>
                <button onclick="addProspect()" class="w-full py-3 rounded text-xs font-bold bg-[#222] hover:bg-[#333] text-white border border-[#444]">+ INJECT INTO PIPELINE</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-3 space-y-1" id="roster-list">
                <!-- Roster Populated by JS -->
            </div>
            
            <div class="p-4 border-t border-line bg-surface">
                <button id="sync-btn" onclick="sendToSheet()" class="w-full py-3 rounded text-[10px] font-bold bg-[#111] text-accent-green border border-accent-green hover:bg-accent-green hover:text-black transition-colors">
                    SYNC TO CLOUD (SHEETS)
                </button>
            </div>
        </aside>

        <section class="flex-1 bg-surface flex flex-col relative overflow-y-auto" id="gate-panel">
            <div class="h-full flex items-center justify-center text-[#555] text-sm mono uppercase tracking-widest">
                System Idle. Select target to initialize command logic.
            </div>
        </section>
    </main>

    <script>
        // =========================================================================
        // 🔴 ARCHITECT: PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        // =========================================================================
        const WEBHOOK_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';
        
        let state = JSON.parse(localStorage.getItem('moe_crm_v4')) || { prospects: [], selectedId: null };

        // The Ascension Engine (Logic Trees)
        const logicTree = {
            'start': { 
                title: "Triage Protocol Selection", 
                desc: "Identify the engagement vector for this target.", 
                script: "Internal: Is this a consumer street intercept or a high-value B2B cold outreach?", 
                actions: [
                    { label: "> Street Intercept (Health)", next: 'street_gate1', color: 'text-white' },
                    { label: "> B2B / Cold Call (Systems)", next: 'b2b_gate1', color: 'text-accent-gold' }
                ]
            },
            // --- B2B COLD CALL TRACK (The 3-Gate Protocol) ---
            'b2b_gate1': { 
                title: "B2B Gate 1: Disarm & Interrupt", 
                desc: "You aren't asking for time; you are qualifying them for an opportunity.", 
                script: "\"Hey [Name], Joey here. I’m not calling to sell you anything. I’m architecting a distribution network for high-performance studio nodes. Are you the decision-maker for the studio’s performance programming?\"", 
                actions: [
                    { label: "> Yes (Is Decision Maker)", next: 'b2b_gate2', color: 'text-accent-green' },
                    { label: "> No / Dismissive", next: 'rejected_hvo', color: 'text-accent-coral' }
                ]
            },
            'b2b_gate2': { 
                title: "B2B Gate 2: The Diagnostic Hook", 
                desc: "Identify the friction. Strip the ego.", 
                script: "\"I’m seeing 90% of KL studios leaking revenue stuck in the 'Star Instructor' trap. No metabolic architecture. Are you feeling that friction, or scaling at velocity?\"", 
                actions: [
                    { label: "> Feeling Friction (Open)", next: 'b2b_gate3', color: 'text-accent-green' },
                    { label: "> Ego Defense (Not Ready)", next: 'rejected_hvo', color: 'text-accent-coral' }
                ]
            },
            'b2b_gate3': { 
                title: "B2B Gate 3: WhatsApp Capture", 
                desc: "The End in Mind. Do not over-explain. Send the asset.", 
                script: "\"I don't explain architecture over a cold call. Drop me your WhatsApp, I'll send a 5-min audio overview. If it resonates, we look at data.\"", 
                actions: [
                    { label: "> WhatsApp Secured", next: 'b2b_nurture', color: 'text-accent-green' }
                ]
            },
            'b2b_nurture': { 
                title: "B2B Nurture: Awaiting Signal", 
                desc: "Asset sent. The ball is in their court.", 
                script: "Internal: Monitor for reply. If no reply in 48h, execute pattern interrupt check-in.", 
                actions: [
                    { label: "> HVO Responded (Advance)", next: 'b2b_active', color: 'text-accent-gold' }
                ]
            },
            'b2b_active': { title: "B2B Node Active", desc: "Target is entering the ecosystem.", script: "", actions: [] },
            'rejected_hvo': { title: "HVO Rejected / Archived", desc: "Energy Vampire or lacking agency. Zero signal loss.", script: "Terminate engagement block.", actions: [{ label: "> Reset Target", next: 'start', color: 'text-[#888]' }] },

            // --- CONSUMER STREET TRACK ---
            'street_gate1': { 
                title: "Gate 1: The Gap Assessment", 
                desc: "Diagnose metabolic drag.", 
                script: "\"Walk me through where you’re currently stuck. What’s the biggest frustration in your health right now?\"", 
                actions: [
                    { label: "> Pain Identified", next: 'street_gate2', color: 'text-white' },
                    { label: "> No Pain Articulated", next: 'rejected', color: 'text-accent-coral' }
                ]
            },
            'street_gate2': { 
                title: "Gate 2: The Value Alignment", 
                desc: "Hard close. Differentiate Price vs. Cost.", 
                script: "\"If nothing changes, what does that cost you in 6 months? Is this investment heavy because you're unsure of the math, or the results?\"", 
                actions: [
                    { label: "> Payment Secured", next: 'ascension', color: 'text-accent-green' },
                    { label: "> Holding Pattern", next: 'followup', color: 'text-accent-gold' }
                ]
            },
            'followup': { title: "Holding Pattern", desc: "Drip nurture logic.", script: "\"What exactly is the variable you're uncertain about?\"", actions: [{ label: "> Converted", next: 'ascension', color: 'text-accent-green' }, { label: "> Dead", next: 'rejected', color: 'text-accent-coral' }] },
            'ascension': { title: "Active: Fuel Protocol", desc: "Client is online. Logistics tracking initiated.", script: "Monitor 21-day inventory cycle and metrics.", actions: [{ label: "> Flag as Builder Potential", next: 'complete', color: 'text-accent-gold' }] },
            'complete': { title: "HVO Builder Track", desc: "Transitioning from consumer to operator.", script: "\"Are you interested in just the results, or the mechanics of how I built this system?\"", actions: [] },
            'rejected': { title: "Lead Terminated", desc: "10:1 Math.", script: "", actions: [{ label: "> Reset", next: 'start', color: 'text-[#888]' }] }
        };

        function addProspect() {
            const name = document.getElementById('new-name').value.trim();
            const phone = document.getElementById('new-phone').value.trim();
            if(!name) { showMessage("System Error: Target name required."); return; }

            const newLead = {
                id: Date.now(), name, phone, 
                source: document.getElementById('new-source').value || 'Unknown', 
                goal: document.getElementById('new-goal').value, 
                stage: 'start', isHVO: false, activeDate: null, metrics: [], notes: "", dateAdded: new Date().toISOString()
            };

            state.prospects.unshift(newLead);
            state.selectedId = newLead.id;
            document.getElementById('new-name').value = '';
            document.getElementById('new-phone').value = '';
            document.getElementById('new-source').value = '';
            saveAndRender();
        }

        function selectProspect(id) {
            saveCurrentNotes();
            state.selectedId = id;
            saveAndRender();
        }

        function advanceLead(nextStage) {
            const prospect = state.prospects.find(p => p.id === state.selectedId);
            if (prospect) {
                prospect.stage = nextStage;
                // Inventory Activation Trigger
                if((nextStage === 'ascension' || nextStage === 'b2b_active') && !prospect.activeDate) {
                    prospect.activeDate = new Date().toISOString();
                }
                saveAndRender();
            }
        }

        function toggleHVO() {
            const prospect = state.prospects.find(p => p.id === state.selectedId);
            if(prospect) { prospect.isHVO = !prospect.isHVO; saveAndRender(); }
        }

        function addMetric() {
            const prospect = state.prospects.find(p => p.id === state.selectedId);
            const age = document.getElementById('metric-age').value;
            const fat = document.getElementById('metric-fat').value;
            
            if(prospect && age && fat) {
                prospect.metrics.push({ date: new Date().toLocaleDateString(), age: parseInt(age), fat: parseFloat(fat), timestamp: Date.now() });
                saveAndRender();
            }
        }

        function saveCurrentNotes() {
            if(!state.selectedId) return;
            const prospect = state.prospects.find(p => p.id === state.selectedId);
            const noteBox = document.getElementById('cadence-journal');
            if (prospect && noteBox) prospect.notes = noteBox.value;
        }

        function deleteProspect(id, skipCheck=false) {
            if(!skipCheck) {
                const btn = document.getElementById(`del-btn-${id}`);
                btn.innerText = "SURE?";
                btn.classList.add('bg-red-900', 'text-white');
                btn.onclick = (e) => { e.stopPropagation(); deleteProspect(id, true); };
                setTimeout(() => { saveAndRender(); }, 3000); // reset after 3s
                return;
            }
            state.prospects = state.prospects.filter(p => p.id !== id);
            if (state.selectedId === id) state.selectedId = null;
            saveAndRender();
        }

        async function sendToSheet() {
            const btn = document.getElementById('sync-btn');
            if (state.prospects.length === 0) { showMessage("Ledger is empty."); return; }
            if (WEBHOOK_URL.includes('YOUR_SCRIPT_ID')) { showMessage("ARCHITECT: You must paste your Google Script URL in the code."); return; }

            saveCurrentNotes();
            saveAndRender();

            btn.innerText = "UPLOADING PAYLOAD...";
            btn.classList.add('animate-pulse', 'bg-accent-green', 'text-black');

            // Find actively changed prospects to sync (simplification: sync all for this version)
            const payload = state.prospects.map(p => ({
                id: p.id, date: p.dateAdded, name: p.name, phone: p.phone, source: p.source, goal: p.goal, 
                stage: p.stage, isHVO: p.isHVO, notes: p.notes
            }));

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "bulk_sync", data: payload })
                });
                
                btn.innerText = "SYNC COMPLETE";
                btn.classList.remove('animate-pulse');
                setTimeout(() => { btn.innerText = "SYNC TO CLOUD (SHEETS)"; btn.classList.remove('bg-accent-green', 'text-black'); }, 3000);
            } catch (error) {
                console.error(error);
                btn.innerText = "SYNC FAILED. CHECK CONSOLE.";
                btn.classList.remove('animate-pulse');
            }
        }

        function saveAndRender() {
            localStorage.setItem('moe_crm_v4', JSON.stringify(state));
            renderRoster();
            renderLogicGate();
            updateMatrix();
        }

        function updateMatrix() {
            document.getElementById('mat-prospects').innerText = state.prospects.filter(p => ['start', 'b2b_gate1', 'street_gate1'].includes(p.stage)).length;
            document.getElementById('mat-guests').innerText = state.prospects.filter(p => ['b2b_gate2', 'b2b_gate3', 'b2b_nurture', 'street_gate2', 'followup'].includes(p.stage)).length;
            document.getElementById('mat-customers').innerText = state.prospects.filter(p => p.stage === 'ascension').length;
            document.getElementById('mat-builders').innerText = state.prospects.filter(p => p.isHVO || p.stage === 'complete' || p.stage === 'b2b_active').length;
        }

        function getInventoryStatus(prospect) {
            if(!prospect.activeDate || !['ascension', 'complete', 'b2b_active'].includes(prospect.stage)) return '';
            const days = Math.floor((Date.now() - new Date(prospect.activeDate).getTime()) / (1000 * 3600 * 24));
            if(days >= 21) return `<span class="text-[9px] bg-red-900/80 text-white px-1 rounded font-bold animate-pulse">REPLENISH (${days}d)</span>`;
            return `<span class="text-[9px] bg-[#222] text-[#888] px-1 rounded">Day ${days}</span>`;
        }

        function getWAUrl(phone, stage) {
            if(!phone) return '#';
            const num = phone.replace(/\D/g,'');
            let msg = "Hey, just checking in.";
            if(stage.includes('b2b_gate3')) msg = "Here is the 5-minute audio overview on the distribution architecture.";
            if(stage === 'ascension') msg = "Checking your protocol compliance today. How is the engine feeling?";
            return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
        }

        function renderRoster() {
            const list = document.getElementById('roster-list');
            list.innerHTML = '';
            state.prospects.forEach(p => {
                const isSelected = p.id === state.selectedId;
                const hvoClass = p.isHVO ? 'hvo-active' : '';
                const inv = getInventoryStatus(p);
                
                list.innerHTML += `
                    <div class="prospect-card p-3 flex justify-between items-center ${isSelected ? 'active' : ''} ${hvoClass} border border-[#222]" onclick="selectProspect(${p.id})">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-bold uppercase truncate ${p.isHVO ? 'text-accent-gold' : 'text-white'}">${p.name}</p>
                            <div class="flex gap-1 mt-1 items-center">
                                <span class="text-[9px] mono bg-[#222] text-[#888] px-1 rounded-sm uppercase truncate max-w-[80px]">${p.stage.replace('_',' ')}</span>
                                ${p.isHVO ? `<span class="text-[9px] mono bg-yellow-900/40 text-yellow-400 px-1 rounded-sm">HVO</span>` : ''}
                                ${inv}
                            </div>
                        </div>
                        <button id="del-btn-${p.id}" onclick="event.stopPropagation(); deleteProspect(${p.id})" class="text-[10px] text-[#555] hover:text-red-500 bg-transparent border-none ml-2 shrink-0 p-1">X</button>
                    </div>
                `;
            });
        }

        function evaluateMetricsPivot(metrics) {
            if(!metrics || metrics.length < 2) return '';
            const first = metrics[0];
            const latest = metrics[metrics.length - 1];
            const daysDiff = Math.floor((latest.timestamp - first.timestamp) / (1000 * 3600 * 24));
            
            if (daysDiff >= 30 && latest.fat >= first.fat) {
                return `<div class="bg-red-900/30 border border-red-500 text-red-400 p-2 text-xs uppercase font-bold text-center mt-2 animate-pulse">⚠️ PIVOT REQUIRED: METRICS STALLED FOR 30+ DAYS</div>`;
            }
            if (latest.fat < first.fat) {
                return `<div class="bg-green-900/20 border border-green-500 text-green-400 p-2 text-xs uppercase font-bold text-center mt-2">ENGINE OPTIMIZING</div>`;
            }
            return '';
        }

        function renderLogicGate() {
            const panel = document.getElementById('gate-panel');
            if(!state.selectedId) {
                panel.innerHTML = `<div class="h-full flex items-center justify-center text-[#555] text-sm mono uppercase tracking-widest">System Idle. Select target to initialize command logic.</div>`;
                return;
            }

            const p = state.prospects.find(x => x.id === state.selectedId);
            const step = logicTree[p.stage];
            const hvoBtn = p.isHVO ? 'bg-yellow-900/40 text-yellow-400 border-yellow-600' : 'bg-[#111] text-[#666] border-line hover:text-white';
            const waUrl = getWAUrl(p.phone, p.stage);
            const pivotAlert = evaluateMetricsPivot(p.metrics);

            let mHtml = (p.metrics || []).map(m => `<div class="flex justify-between text-xs border-b border-[#222] py-1 mono"><span class="text-[#666]">${m.date}</span><span>Age: ${m.age}</span><span class="text-accent-blue">VF: ${m.fat}</span></div>`).join('');

            panel.innerHTML = `
                <!-- Target Header -->
                <div class="p-6 border-b border-line bg-[#0a0a0a] flex justify-between items-start shrink-0">
                    <div>
                        <div class="flex items-center gap-3 mb-1">
                            <h2 class="text-2xl font-bold uppercase tracking-tighter ${p.isHVO ? 'text-accent-gold' : 'text-white'}">${p.name}</h2>
                            ${p.phone ? `<a href="${waUrl}" target="_blank" class="text-[10px] bg-[#25D366]/20 text-[#25D366] border border-[#25D366] px-2 py-1 rounded uppercase tracking-widest hover:bg-[#25D366] hover:text-black transition-colors">WhatsApp ↗</a>` : ''}
                        </div>
                        <p class="text-[10px] mono text-[#666] uppercase">${p.phone || 'No Contact Data'} | Src: ${p.source} | Obj: ${p.goal}</p>
                    </div>
                    <button onclick="toggleHVO()" class="px-3 py-2 text-[10px] font-bold uppercase tracking-widest rounded ${hvoBtn}">
                        ${p.isHVO ? '★ HVO SIGNAL ACTIVE' : 'Flag HVO Signal'}
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto flex flex-col md:flex-row">
                    <!-- Script & Logic Engine -->
                    <div class="flex-1 border-r border-line p-6 flex flex-col">
                        <p class="text-[10px] mono text-accent-blue uppercase mb-2">Protocol: ${step.title}</p>
                        <p class="text-sm text-[#aaa] mb-6">${step.desc}</p>
                        
                        ${step.script ? `
                        <div class="border-l-2 border-accent-blue bg-accent-blue/5 p-4 mb-6 rounded-r">
                            <p class="text-[9px] mono text-accent-blue uppercase mb-1 opacity-70">Execution Script</p>
                            <p class="text-[13px] text-white italic">" ${step.script} "</p>
                        </div>` : ''}

                        <div class="space-y-2 mb-8">
                            ${step.actions.map(a => `
                                <button onclick="advanceLead('${a.next}')" class="w-full bg-[#111] border border-[#333] p-3 text-xs font-bold uppercase tracking-widest ${a.color} hover:bg-[#222] text-left rounded">
                                    ${a.label}
                                </button>
                            `).join('')}
                        </div>

                        <div class="mt-auto border-t border-line pt-4">
                            <p class="text-[10px] mono text-[#666] uppercase mb-2">Architect Journal (NLP/Pain Points)</p>
                            <textarea id="cadence-journal" onblur="saveCurrentNotes()" class="w-full h-24 text-xs" placeholder="Log deep pain points, objections, and exact words used...">${p.notes}</textarea>
                        </div>
                    </div>

                    <!-- Lossless Metrics Engine -->
                    <div class="w-full md:w-[280px] p-6 bg-[#0a0a0a] flex flex-col shrink-0">
                        <p class="text-[10px] mono text-[#666] uppercase border-b border-[#222] pb-2 mb-4">Lossless Metric Engine</p>
                        
                        <div class="flex gap-2 mb-2">
                            <input type="number" id="metric-age" placeholder="Body Age" class="w-1/2 text-center text-sm py-2">
                            <input type="number" id="metric-fat" placeholder="Visc Fat" class="w-1/2 text-center text-sm py-2">
                        </div>
                        <button onclick="addMetric()" class="w-full py-2 bg-[#222] hover:bg-[#333] border border-[#444] text-[10px] text-white font-bold uppercase tracking-widest rounded mb-4">Log Biometrics</button>
                        
                        <div class="flex-1 overflow-y-auto space-y-1 mb-2 border border-[#222] bg-[#050505] p-2 rounded">
                            ${mHtml || '<p class="text-[10px] text-[#444] text-center mt-2 mono">No hardware data.</p>'}
                        </div>
                        
                        ${pivotAlert}
                        ${getInventoryStatus(p) ? `<div class="bg-[#111] border border-[#333] text-center p-2 text-[10px] mono text-[#888] rounded mt-2">Active Cycle: ${getInventoryStatus(p)}</div>` : ''}
                    </div>
                </div>
            `;
        }

        function showMessage(msg) {
            const m = document.getElementById('custom-modal');
            m.innerHTML = `<div class="bg-[#111] border border-[#333] p-6 rounded shadow-2xl max-w-sm w-full text-center"><p class="text-sm font-bold text-white uppercase tracking-widest mb-4">${msg}</p><button onclick="document.getElementById('custom-modal').classList.remove('active')" class="bg-[#222] hover:bg-[#333] text-white px-6 py-2 text-xs rounded border border-[#444]">Acknowledge</button></div>`;
            m.classList.add('active');
        }

        saveAndRender();
    </script>

    <!-- Custom Modal Container -->
    <div id="custom-modal"></div>
</body>
</html>
